services:
  jebrex-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jebrex-ai-api
    restart: unless-stopped
    ports:
      - "${JEBREX_PORT:-7860}:7860"
    environment:
      PORT: "7860"
      # Set a strong random secret in production via host environment or .env (never commit .env!)
      NOURAI_SECRET_KEY: "${NOURAI_SECRET_KEY:-}"
    volumes:
      - jebrex_prod_data:/app/data/production
      - jebrex_artifact_cache:/app/data/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:7860/api/v1/health', timeout=3); assert r.status == 200"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  jebrex_prod_data:
  jebrex_artifact_cache:
