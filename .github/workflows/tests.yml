name: Jebrex AI — Automated Tests & Security Gates

on:
  push:
    branches:
      - main
      - comprehensive_project_audit
      - "dev/**"
  pull_request:
    branches:
      - main
      - comprehensive_project_audit

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/base.txt
          pip install --no-cache-dir pytest

      - name: Secret and large-artifact hygiene check
        run: |
          python - <<'PY'
          import subprocess, sys
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = [p for p in tracked if p.endswith((".env", ".pem", ".key", ".safetensors", ".gguf")) or "/.env" in p]
          if forbidden:
              print("FORBIDDEN TRACKED FILES:", forbidden)
              sys.exit(1)
          print(f"Hygiene OK: {len(tracked)} tracked files verified, 0 forbidden secrets/binaries.")
          PY

      - name: Run Jebrex AI full self-contained test suite
        env:
          PYTHONPATH: "."
        run: |
          pytest -v \
            tests/test_jebrex_data_gate.py \
            tests/test_jebrex_storage_and_versioning.py \
            tests/test_jebrex_bpe_tokenizer.py \
            tests/test_jebrex_model_and_training.py \
            tests/test_jebrex_foundation_v2.py \
            tests/test_jebrex_inference_and_chat.py \
            tests/test_jebrex_conversational_and_web.py \
            tests/test_jebrex_phase_f.py \
            tests/test_jebrex_apps.py \
            tests/test_jebrex_security.py \
            tests/test_jebrex_benchmark.py \
            tests/test_phase19_user_interface.py \
            tests/test_stage_b_to_l_certification.py \
            -p no:cacheprovider

      - name: Run automated security audit (enforce 0 CRITICAL and 0 HIGH)
        env:
          PYTHONPATH: "."
        run: |
          python - <<'PY'
          import json, sys
          from security.security_audit_v2 import run_comprehensive_security_audit
          report = run_comprehensive_security_audit()
          print(json.dumps({
              "security_gate": report["security_gate"],
              "all_verification_checks_passed": report["all_verification_checks_passed"],
              "open_counts": report["open_counts"],
          }, indent=2))
          if report["security_gate"] != "PASS_NO_OPEN_CRITICAL_OR_HIGH":
              sys.exit(1)
          PY
