<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NourAI" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="google-site-verification" content="googleba5e2e501ed82fe6" />
  <meta name="google-site-verification" content="d1hgHSrz7rNQO4_8yL8cb1md45P1GtW2ekbQQY0xELc" />
  <meta name="description" content="NourAI — مساعد ذكاء اصطناعي متعدد اللغات يدعم العربية والإنجليزية والفرنسية" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#212121" />
  <title>NourAI</title>
  <style>
    :root {
      --bg-main: #0f0f12;
      --bg-sidebar: #16161a;
      --bg-elevated: #1c1c22;
      --bg-pill: #1e1e24;
      --bg-hover: rgba(255, 255, 255, 0.06);
      --bg-user-msg: #272730;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #3b82f6;
      --accent-glow: linear-gradient(135deg, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      --btn-main: #ffffff;
      --btn-text: #0f0f12;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="light"] {
      --bg-main: #f9fafb;
      --bg-sidebar: #ffffff;
      --bg-elevated: #ffffff;
      --bg-pill: #ffffff;
      --bg-hover: rgba(15, 23, 42, 0.05);
      --bg-user-msg: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border: rgba(15, 23, 42, 0.1);
      --btn-main: #111827;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", Tahoma, sans-serif;
      background: radial-gradient(ellipse 80% 45% at 50% -10%, rgba(96, 165, 250, 0.09), transparent), var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    button, select, textarea, input {
      font-family: inherit;
    }

    select option {
      background: var(--bg-sidebar);
      color: var(--text-main);
    }

    /* ---------- Sidebar ---------- */
    aside.sidebar {
      width: 268px;
      background: var(--bg-sidebar);
      border-inline-end: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0.65rem;
      gap: 0.35rem;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.22s ease, padding 0.22s ease, transform 0.25s ease;
    }

    body.hide-sidebar aside.sidebar {
      width: 0;
      padding: 0;
      border-inline-end: none;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.45rem 0.55rem 0.45rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--accent-glow);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(96, 165, 250, 0.3);
    }

    .sidebar-close {
      display: none;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.68rem 0.85rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-align: start;
      transition: background 0.15s, border-color 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--bg-hover);
      border-color: rgba(96, 165, 250, 0.4);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-section {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.85rem 0.6rem 0.25rem 0.6rem;
    }

    .session-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      overflow-y: auto;
      flex: 1;
    }

    .session-item {
      padding: 0.58rem 0.7rem;
      border-radius: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.9rem;
      color: var(--text-main);
      transition: background 0.15s;
    }

    .session-item:hover, .session-item.active {
      background: var(--bg-hover);
    }

    .session-item.active {
      font-weight: 600;
    }

    .session-title {
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      unicode-bidi: plaintext;
    }

    .session-actions {
      display: none;
      gap: 0.1rem;
    }

    .session-item:hover .session-actions {
      display: flex;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 80;
    }

    /* ---------- Main ---------- */
    main.chat-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    header.chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      padding: 0.55rem 0.9rem;
      padding-top: calc(0.55rem + var(--sat));
      min-height: 58px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 15, 18, 0.72);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    [data-theme="light"] header.chat-header {
      background: rgba(249, 250, 251, 0.85);
    }

    .hdr-start, .hdr-end {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      min-width: 0;
    }

    .model-select, .lang-select {
      background: transparent;
      color: var(--text-main);
      border: 1px solid transparent;
      border-radius: 0.6rem;
      padding: 0.42rem 0.6rem;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 40vw;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lang-select {
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .model-select:hover, .lang-select:hover {
      background: var(--bg-hover);
      border-color: var(--border);
    }

    .icon-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      min-width: 38px;
      height: 38px;
      padding: 0 0.5rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .code-header .icon-btn,
    .bubble-actions .icon-btn,
    .session-actions .icon-btn {
      min-width: 0;
      height: 28px;
      padding: 0 0.5rem;
      font-size: 0.78rem;
    }

    #model-status-badge {
      font-size: 0.72rem;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.28);
      border-radius: 999px;
      padding: 0.14rem 0.55rem;
      font-weight: 600;
    }

    #error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border-bottom: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.5rem 1rem;
      font-size: 0.86rem;
      justify-content: space-between;
      align-items: center;
    }

    /* ---------- Welcome ---------- */
    #welcome-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .hero-emblem {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--accent-glow);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 10px 30px rgba(96, 165, 250, 0.25);
    }

    .hero-greeting {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .quick-chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 220px));
      gap: 0.65rem;
      width: 100%;
      max-width: 460px;
    }

    .chip {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.75rem 0.9rem;
      border-radius: 0.9rem;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: start;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .chip:hover {
      background: var(--bg-hover);
      border-color: rgba(96, 165, 250, 0.45);
      transform: translateY(-1px);
    }

    /* ---------- Messages ---------- */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 1.25rem 1rem 1.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    #chat-messages:empty {
      display: none;
    }

    .message-row {
      display: flex;
      width: 100%;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .message-row.row-user {
      justify-content: flex-end;
    }

    .assistant-avatar {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--accent-glow);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 0.15rem;
    }

    .message-bubble {
      line-height: 1.75;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
      font-size: 0.98rem;
    }

    .message-user {
      background: var(--bg-user-msg);
      padding: 0.72rem 1.1rem;
      border-radius: 1.35rem;
      border-end-end-radius: 0.35rem;
      max-width: 80%;
    }

    .message-assistant {
      flex: 1;
      min-width: 0;
      padding: 0.05rem 0;
    }

    .message-assistant .msg-content:empty::before {
      content: "";
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--text-main);
      vertical-align: middle;
      animation: nourai-pulse 1s ease-in-out infinite;
    }

    @keyframes nourai-pulse {
      0%, 100% { transform: scale(0.7); opacity: 0.45; }
      50% { transform: scale(1); opacity: 1; }
    }

    .msg-content pre {
      background: #09090b;
      color: #e5e7eb;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      margin: 0.75rem 0;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.75rem;
      background: #141418;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: #9ca3af;
      font-family: monospace;
    }

    .msg-content pre code {
      display: block;
      padding: 0.85rem;
      font-family: Consolas, "SF Mono", monospace;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .generated-img {
      max-width: 100%;
      height: auto;
      border-radius: 0.85rem;
      border: 1px solid var(--border);
      margin: 0.6rem 0;
      display: block;
    }

    .msg-content svg {
      max-width: 100%;
      height: auto;
    }

    .bubble-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.35rem;
      opacity: 0.7;
    }

    .bubble-actions:hover {
      opacity: 1;
    }

    /* ---------- Composer ---------- */
    .composer-wrap {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 0.25rem 0.85rem calc(0.6rem + var(--sab)) 0.85rem;
    }

    .composer-pill {
      display: flex;
      align-items: flex-end;
      gap: 0.25rem;
      background: var(--bg-pill);
      border: 1px solid var(--border);
      border-radius: 1.65rem;
      padding: 0.42rem 0.5rem;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer-pill:focus-within {
      border-color: rgba(96, 165, 250, 0.55);
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.12);
    }

    textarea#prompt-input {
      flex: 1;
      min-height: 40px;
      max-height: 180px;
      padding: 0.5rem 0.4rem;
      border: none;
      background: transparent;
      color: var(--text-main);
      resize: none;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      unicode-bidi: plaintext;
    }

    textarea#prompt-input::placeholder {
      color: var(--text-muted);
    }

    .send-circle-btn, .stop-circle-btn {
      width: 36px;
      height: 36px;
      margin: 2px;
      border-radius: 50%;
      border: none;
      background: var(--btn-main);
      color: var(--btn-text);
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }

    .send-circle-btn:active {
      transform: scale(0.94);
    }

    .send-circle-btn {
      display: flex;
    }

    .stop-circle-btn {
      display: none;
      background: #ef4444;
      color: #ffffff;
    }

    .send-circle-btn svg, .stop-circle-btn svg {
      width: 18px;
      height: 18px;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding-top: 0.45rem;
    }

    /* ---------- Settings ---------- */
    aside.settings-panel {
      display: none;
      position: fixed;
      top: 62px;
      inset-inline-end: 14px;
      width: 310px;
      max-height: calc(100dvh - 80px);
      overflow-y: auto;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 100;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
    }

    aside.settings-panel.open {
      display: flex;
    }

    aside.settings-panel .new-chat-btn {
      border: 1px solid var(--border);
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .control-group select, .control-group input {
      padding: 0.5rem 0.65rem;
      border-radius: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text-main);
      font-size: 16px;
    }

    /* ---------- Cookie banner ---------- */
    #cookie-banner {
      display: none;
      position: fixed;
      bottom: 16px;
      inset-inline: 16px;
      max-width: 540px;
      margin: 0 auto;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 0.75rem 1rem;
      font-size: 0.84rem;
      color: var(--text-main);
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 200;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .cookie-accept-btn {
      background: var(--btn-main);
      color: var(--btn-text);
      border: none;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    @media (hover: none) {
      .session-actions {
        display: flex;
      }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 768px) {
      aside.sidebar,
      body.hide-sidebar aside.sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        width: min(82vw, 300px);
        z-index: 90;
        padding: calc(0.55rem + var(--sat)) 0.6rem calc(0.55rem + var(--sab)) 0.6rem;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.65);
      }

      [dir="rtl"] aside.sidebar {
        transform: translateX(100%);
      }

      [dir="ltr"] aside.sidebar {
        transform: translateX(-100%);
      }

      body.sidebar-open aside.sidebar {
        transform: none;
      }

      body.sidebar-open .sidebar-overlay {
        display: block;
      }

      .sidebar-close {
        display: inline-flex;
      }

      #model-status-badge {
        display: none;
      }

      .hero-greeting {
        font-size: 1.45rem;
      }

      .quick-chips {
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .chip {
        padding: 0.65rem 0.7rem;
        font-size: 0.82rem;
      }

      .message-user {
        max-width: 88%;
      }

      #chat-messages {
        padding: 0.85rem 0.85rem 1.25rem 0.85rem;
      }

      aside.settings-panel {
        top: auto;
        bottom: 0;
        inset-inline: 0;
        width: 100%;
        max-height: 82dvh;
        border-radius: 1.25rem 1.25rem 0 0;
        padding-bottom: calc(1rem + var(--sab));
      }

      #cookie-banner {
        bottom: calc(96px + var(--sab));
        inset-inline: 10px;
      }
    }

    @media print {
      aside.sidebar, .sidebar-overlay, header.chat-header, .composer-wrap, aside.settings-panel, #cookie-banner, #welcome-hero, .bubble-actions {
        display: none !important;
      }
      body, main.chat-area, #chat-messages {
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarMobile()"></div>

  <aside class="sidebar" id="sidebar-panel" aria-label="Conversation History">
    <div class="sidebar-top">
      <div class="brand"><span class="brand-logo">✦</span><span>NourAI</span></div>
      <button class="icon-btn sidebar-close" onclick="toggleSidebar()" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="new-chat-btn" id="new-session-btn" onclick="createNewSession(); closeSidebarMobile();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span id="new-session-label">محادثة جديدة</span>
    </button>
    <input type="search" id="session-search-input" placeholder="🔍 ابحث في المحادثات..." oninput="renderSessionList()" style="width:100%;padding:0.45rem 0.65rem;border-radius:0.6rem;border:1px solid var(--border);background:var(--bg-pill);color:var(--text-main);font-size:0.84rem;outline:none;margin-top:0.25rem;" />
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.45rem 0.2rem 0.45rem;">
      <span class="sidebar-section" id="ui-history-title" style="padding:0;">المحادثات</span>
      <button class="icon-btn" onclick="toggleFavoritesView()" id="fav-filter-btn" style="min-width:0;height:26px;font-size:0.75rem;padding:0 0.45rem;" title="عرض الإجابات المفضلة">⭐ المفضلة</button>
    </div>
    <ul class="session-list" id="session-history-list"></ul>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div class="hdr-start">
        <button class="icon-btn" onclick="toggleSidebar()" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <select id="engine-mode-select" class="model-select" onchange="saveModeCookie()" aria-label="النموذج">
          <option value="team_ai">NourAI فريق الـ 5 مساعدين</option>

  <div id="cookie-banner" role="region" aria-label="Cookie Consent">

  <script>
    const I18N = {
      arabic: {
        dir: "rtl",
        lang: "ar",
        heroTitle: "كيف يمكنني مساعدتك اليوم؟",
        history: "المحادثات",
        newSession: "محادثة جديدة",
        placeholder: "اسأل NourAI...",
        copy: "نسخ",
        copied: "تم النسخ ✓",
        renamePrompt: "الاسم الجديد للمحادثة:"
      },
      english: {
        dir: "ltr",
        lang: "en",
        heroTitle: "What can I help with?",
        history: "Chats",
        newSession: "New chat",
        placeholder: "Ask NourAI...",
        copy: "Copy",
        copied: "Copied ✓",
        renamePrompt: "New chat title:"
      },
      french: {
        dir: "ltr",
        lang: "fr",
        heroTitle: "Comment puis-je vous aider ?",
        history: "Discussions",
        newSession: "Nouvelle discussion",
        placeholder: "Posez une question...",
        copy: "Copier",
        copied: "Copié ✓",
        renamePrompt: "Nouveau titre :"
      }
    };

    const API_BASE = (window.location.hostname.endsWith("web.app") || window.location.hostname.endsWith("firebaseapp.com"))
      ? "https://nourai-studio.onrender.com"
      : "";
    let backendOnline = true;
    let currentLanguage = "arabic";
    let sessions = [];
    let activeSessionId = null;
    let authToken = null;
    let stopStreamingFlag = false;
    let pendingImageBase64 = "";
    let pendingImageMime = "";
    let pendingImageName = "";

    /* Cookie Helper Functions */
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + encodeURIComponent(value || "") + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie.split(";");
      for (let i = 0; i < parts.length; i++) {
        const c = parts[i].trim();
        if (c.indexOf(prefix) === 0) {
          return decodeURIComponent(c.substring(prefix.length));
        }
      }
      return "";
    }

    function acceptCookies() {
      setCookie("nourai_cookies_accepted", "1", 365);
      document.getElementById("cookie-banner").style.display = "none";
    }

    function saveModeCookie() {
      setCookie("nourai_mode", document.getElementById("engine-mode-select").value, 90);
    }

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      document.getElementById("error-banner-text").textContent = msg;
      banner.style.display = "flex";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function isMobileLayout() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function toggleSidebar() {
      if (isMobileLayout()) {
        document.body.classList.toggle("sidebar-open");
      } else {
        document.body.classList.toggle("hide-sidebar");
      }
    }

    function closeSidebarMobile() {
      document.body.classList.remove("sidebar-open");
    }

    function toggleTheme() {
      const root = document.getElementById("html-root");
      const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      setCookie("nourai_theme", next, 180);
    }

    function toggleSettings() {
      document.getElementById("settings-panel").classList.toggle("open");
    }

    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 150) + "px";
    }

    function handleComposerKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendStreamingMessage();
      }
    }

    function toggleSmartTools() {
      const m = document.getElementById("smart-tools-menu");
      if (!m) return;
      m.style.display = m.style.display === "flex" ? "none" : "flex";
    }

    function applySmartTool(prefix) {
      const input = document.getElementById("prompt-input");
      const current = input.value.trim();
      input.value = current ? (prefix + current) : prefix;
      document.getElementById("smart-tools-menu").style.display = "none";
      input.focus();
      autoResizeTextarea(input);
    }

    function useStarterPrompt(text) {
      const input = document.getElementById("prompt-input");
      input.value = text;
      sendStreamingMessage();
    }

    function loadLocalSessions() {
      try {
        return JSON.parse(localStorage.getItem("nourai_local_sessions") || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveLocalSessions(list) {
      try {
        localStorage.setItem("nourai_local_sessions", JSON.stringify(list));
      } catch (e) {}
    }

    function activateServerlessFallback() {
      backendOnline = false;
      try { sessionStorage.setItem("nourai_serverless", "1"); } catch (e) {}
      authToken = "local-browser-session";
      const badge = document.getElementById("model-status-badge");
      if (badge) badge.textContent = "سحابي";
      hideError();
      return authToken;
    }

    async function fetchWithTimeout(url, options, ms = 4000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        return await fetch(url, { ...(options || {}), signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function ensureAuthenticated() {
      if (authToken) return authToken;
      try {
        if (API_BASE !== "" && sessionStorage.getItem("nourai_serverless") === "1") {
          return activateServerlessFallback();
        }
      } catch (e) {}
      const savedToken = getCookie("nourai_token");
      if (savedToken && API_BASE === "") {
        authToken = savedToken;
        return authToken;
      }
      try {
        const res = await fetchWithTimeout(
          API_BASE + "/api/v1/auth/guest",
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) },
          API_BASE === "" ? 4000 : 1200
        );
        if (!res.ok) throw new Error("Backend unavailable (" + res.status + ")");
        const data = await res.json();
        authToken = data.access_token;
        backendOnline = true;
        setCookie("nourai_token", authToken, 7);
        return authToken;
      } catch (err) {
        return activateServerlessFallback();
      }
    }

    async function refreshSessionList() {
      let token = await ensureAuthenticated();
      if (!token) return;
      if (!backendOnline) {
        sessions = loadLocalSessions();
        renderSessionList();
        return;
      }
      try {
        let res = await fetch(API_BASE + "/api/v1/sessions", {
          headers: { "Authorization": "Bearer " + token }
        });
        if (res.status === 401) {
          authToken = null;
          activeSessionId = null;
          setCookie("nourai_token", "", -1);
          setCookie("nourai_active_session", "", -1);
          token = await ensureAuthenticated();
          if (!token || !backendOnline) {
            sessions = loadLocalSessions();
            renderSessionList();
            return;
          }
          res = await fetch(API_BASE + "/api/v1/sessions", {
            headers: { "Authorization": "Bearer " + token }
          });
        }
        if (!res.ok) throw new Error("Sessions error");
        const data = await res.json();
        sessions = data.sessions || [];
        if (activeSessionId && !sessions.some(s => s.session_id === activeSessionId)) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
        }
        renderSessionList();
      } catch (err) {
        activateServerlessFallback();
        sessions = loadLocalSessions();
        renderSessionList();
      }
    }

    function getPinnedSet() {
      const raw = getCookie("nourai_pinned_sessions");
      return new Set(raw ? raw.split(",").filter(Boolean) : []);
    }

    function togglePinSession(sessionId) {
      const pinned = getPinnedSet();
      if (pinned.has(sessionId)) pinned.delete(sessionId);
      else pinned.add(sessionId);
      setCookie("nourai_pinned_sessions", Array.from(pinned).join(","), 180);
      renderSessionList();
    }

    function renderSessionList() {
      const list = document.getElementById("session-history-list");
      list.innerHTML = "";
      const searchQ = (document.getElementById("session-search-input")?.value || "").trim().toLowerCase();
      const pinned = getPinnedSet();
      const sorted = [...sessions].sort((a, b) => (pinned.has(b.session_id) ? 1 : 0) - (pinned.has(a.session_id) ? 1 : 0));
      for (const s of sorted) {
        const titleTxt = (s.title || s.session_id);
        if (searchQ && !titleTxt.toLowerCase().includes(searchQ)) continue;
        const isPinned = pinned.has(s.session_id);
        const li = document.createElement("li");
        li.className = "session-item" + (s.session_id === activeSessionId ? " active" : "");

        const titleSpan = document.createElement("span");
        titleSpan.className = "session-title";
        titleSpan.textContent = (isPinned ? "📌 " : "") + (s.title || s.session_id);
        titleSpan.onclick = () => { selectSession(s.session_id); closeSidebarMobile(); };

        const actions = document.createElement("div");
        actions.className = "session-actions";

        const pinBtn = document.createElement("button");
        pinBtn.className = "icon-btn";
        pinBtn.style.fontSize = "0.72rem";
        pinBtn.textContent = "📌";
        pinBtn.title = "تثبيت";
        pinBtn.onclick = (e) => { e.stopPropagation(); togglePinSession(s.session_id); };

        const renameBtn = document.createElement("button");
        renameBtn.className = "icon-btn";
        renameBtn.style.fontSize = "0.75rem";
        renameBtn.textContent = "✎";
        renameBtn.onclick = (e) => { e.stopPropagation(); renameSession(s.session_id, s.title); };

        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn";
        delBtn.style.fontSize = "0.75rem";
        delBtn.textContent = "✕";
        delBtn.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };

        actions.appendChild(pinBtn);
        actions.appendChild(renameBtn);
        actions.appendChild(delBtn);
        li.appendChild(titleSpan);
        li.appendChild(actions);
        list.appendChild(li);
      }
    }

    function updateHeroVisibility() {
      const container = document.getElementById("chat-messages");
      document.getElementById("welcome-hero").style.display = container.children.length === 0 ? "flex" : "none";
    }

    async function selectSession(sessionId) {
      const token = await ensureAuthenticated();
      if (!token) return;
      if (!backendOnline) {
        const local = loadLocalSessions().find(s => s.session_id === sessionId);
        if (!local) return;
        activeSessionId = sessionId;
        renderSessionList();
        const container = document.getElementById("chat-messages");
        container.innerHTML = "";
        for (const msg of (local.messages || [])) {
          const obj = appendMessageBubble(msg.role, "");
          renderFormattedContent(obj.textNode, msg.content);
        }
        updateHeroVisibility();
        return;
      }
      try {
        const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId, {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
          renderSessionList();
          return;
        }
        activeSessionId = sessionId;
        setCookie("nourai_active_session", sessionId, 7);
        renderSessionList();
        const data = await res.json();
        const container = document.getElementById("chat-messages");
        container.innerHTML = "";
        for (const msg of (data.session.messages || [])) {
          const obj = appendMessageBubble(msg.role, "");
          renderFormattedContent(obj.textNode, msg.content);
        }
        updateHeroVisibility();
      } catch (err) {
        showError(err.message);
      }
    }

    async function renameSession(sessionId, oldTitle) {
      const newTitle = prompt(I18N[currentLanguage].renamePrompt, oldTitle || "");
      if (!newTitle || !newTitle.trim()) return;
      const token = await ensureAuthenticated();
      if (!token) return;
      const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId + "/rename", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ title: newTitle.trim() })
      });
      if (res.ok) await refreshSessionList();
    }

    async function deleteSession(sessionId) {
      const token = await ensureAuthenticated();
      if (!token) return;
      const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      if (res.ok) {
        if (activeSessionId === sessionId) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
          document.getElementById("chat-messages").innerHTML = "";
          updateHeroVisibility();
        }
        await refreshSessionList();
      }
    }

    async function stopGeneration() {
      stopStreamingFlag = true;
      const token = await ensureAuthenticated();
      if (!token) return;
      await fetch(API_BASE + "/api/v1/chat/stop", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token }
      });
    }

    async function runNextWorkflowStep(wfId, goal, stepsJson, btnEl) {
      const steps = JSON.parse(stepsJson || "[]");
      const doneCount = Number(btnEl.dataset.step || "0");
      if (doneCount >= steps.length) return;
      const stepEl = document.getElementById(`${wfId}-s-${doneCount}`);
      const statusEl = document.getElementById(`${wfId}-status`);
      btnEl.disabled = true;
      statusEl.textContent = `جاري تنفيذ المرحلة ${doneCount + 1}...`;
      const geminiKey = (document.getElementById("gemini-key-input")?.value || "").trim();
      const out = await callCloudLLM(
        `Execute ONLY step ${doneCount + 1} ("${steps[doneCount]}") for the goal "${goal}" concisely in Arabic.`,
        steps[doneCount],
        geminiKey
      );
      if (stepEl) {
        stepEl.style.borderColor = "#22c55e";
        stepEl.innerHTML += `<div style="margin-top:0.35rem;color:#86efac;font-size:0.82rem;">✅ ${escapeHtml(out || ("تم إنجاز «" + steps[doneCount] + "» بنجاح."))}</div>`;
      }
      const next = doneCount + 1;
      btnEl.dataset.step = String(next);
      btnEl.disabled = false;
      if (next >= steps.length) {
        btnEl.style.display = "none";
        statusEl.textContent = "✅ اكتملت جميع المراحل!";
      } else {
        statusEl.textContent = `تمت المرحلة ${next}/${steps.length} — اضغط للمتابعة`;
      }
    }

    function cleanAnswerText(raw) {
      if (!raw) return "";
      const codeBlocks = [];
      let text = raw.replace(/```[\s\S]*?```/g, (m) => {
        codeBlocks.push(m);
        return `@@CODE_BLOCK_${codeBlocks.length - 1}@@`;
      });

      // 1 & 9. Remove unnecessary filler intros & redundant lines
      text = text.replace(/^(?:بالتأكيد[!،.\s]*|يسعدني مساعدتك[!،.\s]*|بكل سرور[!،.\s]*|مرحباً[!،.\s]*إليك[^:\n]*[:\n]+)/i, "").trim();

      // 7. Fix common Arabic spelling errors
      const fixes = {
        "مادا": "ماذا", "هاذا": "هذا", "هاذه": "هذه", "لاكن": "لكن",
        "ذالك": "ذلك", "انشاء الله": "إن شاء الله", "ان شاء الله": "إن شاء الله",
        "شكرا جزيلا": "شكراً جزيلاً", "فى ": "في ", "على ان ": "على أن "
      };
      for (const [wrong, right] of Object.entries(fixes)) {
        text = text.split(wrong).join(right);
      }

      // 8. Avoid excessive emojis (collapse repeated emojis & strip purely decorative bursts)
      text = text.replace(/([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}])(?:\s*\1)+/gu, "$1");

      // Deduplicate identical consecutive lines
      const lines = text.split("\n");
      const deduped = [];
      let prev = "";
      for (const line of lines) {
        const t = line.trim();
        if (t && t === prev) continue;
        deduped.push(line);
        prev = t;
      }
      text = deduped.join("\n").replace(/\n{3,}/g, "\n\n").trim();

      // Restore code blocks intact
      text = text.replace(/@@CODE_BLOCK_(\d+)@@/g, (_, idx) => codeBlocks[Number(idx)] || "");
      return text;
    }

    function renderMarkdownTable(tableLines) {
      const rows = tableLines
        .map(l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim()))
        .filter(cells => cells.length > 0 && !cells.every(c => /^[-:]+$/.test(c)));
      if (!rows.length) return "";
      let html = '<div style="overflow-x:auto;margin:0.6rem 0;"><table style="width:100%;border-collapse:collapse;font-size:0.88rem;border:1px solid var(--border);">';
      rows.forEach((cells, rIdx) => {
        const tag = rIdx === 0 ? "th" : "td";
        const bg = rIdx === 0 ? "background:var(--bg-hover);font-weight:700;" : "";
        html += "<tr>" + cells.map(c => `<${tag} style="border:1px solid var(--border);padding:0.45rem 0.65rem;text-align:start;${bg}">${c}</${tag}>`).join("") + "</tr>";
      });
      html += "</table></div>";
      return html;
    }

    function formatInlineMarkdown(text) {
      if (text.includes("[KGRAPH_JSON]") && text.includes("[/KGRAPH_JSON]")) {
        const parts = text.split(/\[KGRAPH_JSON\]([\s\S]*?)\[\/KGRAPH_JSON\]/g);
        let out = "";
        for (let i = 0; i < parts.length; i++) out += (i % 2 === 0 ? formatInlineMarkdown(parts[i]) : renderKGraphBlock(parts[i]));
        return out;
      }
      if (text.includes("[WORKFLOW_JSON]") && text.includes("[/WORKFLOW_JSON]")) {
        const parts = text.split(/\[WORKFLOW_JSON\]([\s\S]*?)\[\/WORKFLOW_JSON\]/g);
        let out = "";
        for (let i = 0; i < parts.length; i++) out += (i % 2 === 0 ? formatInlineMarkdown(parts[i]) : renderWorkflowBlock(parts[i]));
        return out;
      }
      if (text.includes("[QUIZ_JSON]") && text.includes("[/QUIZ_JSON]")) {
        const parts = text.split(/\[QUIZ_JSON\]([\s\S]*?)\[\/QUIZ_JSON\]/g);
        let out = "";
        for (let i = 0; i < parts.length; i++) {
          if (i % 2 === 0) out += formatInlineMarkdown(parts[i]);
          else out += renderQuizBlock(parts[i]);
        }
        return out;
      }
      let s = escapeHtml(text);
      s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" class="generated-img" loading="lazy" />');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:#93c5fd;text-decoration:underline;">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:0.1rem 0.35rem;border-radius:0.3rem;font-size:0.86em;">$1</code>');

      const lines = s.split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const ln = lines[i].trim();
        if (ln.startsWith("|") && ln.endsWith("|")) {
          const tbl = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            tbl.push(lines[i]);
            i++;
          }
          out.push(renderMarkdownTable(tbl));
          continue;
        }
        if (/^###\s+(.+)$/.test(ln)) {
          out.push(`<h4 style="margin:0.65rem 0 0.25rem 0;font-size:1rem;font-weight:700;">${ln.replace(/^###\s+/, "")}</h4>`);
        } else if (/^##\s+(.+)$/.test(ln)) {
          out.push(`<h3 style="margin:0.75rem 0 0.3rem 0;font-size:1.08rem;font-weight:700;">${ln.replace(/^##\s+/, "")}</h3>`);
        } else if (/^[-•]\s+(.+)$/.test(ln)) {
          out.push(`<div style="padding-inline-start:0.85rem;margin:0.15rem 0;">• ${ln.replace(/^[-•]\s+/, "")}</div>`);
        } else if (ln === "---") {
          out.push('<hr style="border:none;border-top:1px solid var(--border);margin:0.65rem 0;" />');
        } else if (ln === "") {
          out.push('<div style="height:0.35rem;"></div>');
        } else {
          out.push(`<div>${ln}</div>`);
        }
        i++;
      }
      return out.join("");
    }

    function renderFormattedContent(targetEl, rawText) {
      const cleaned = cleanAnswerText(rawText);
      targetEl.dataset.raw = cleaned;
      if (!cleaned.includes("```")) {
        targetEl.innerHTML = formatInlineMarkdown(cleaned);
        return;
      }
      const parts = cleaned.split(/```(\w*)\n?([\s\S]*?)```/g);
      let html = "";
      for (let i = 0; i < parts.length; i += 3) {
        const normalText = parts[i] || "";
        html += formatInlineMarkdown(normalText);
        if (i + 2 < parts.length) {
          const lang = (parts[i + 1] || "code").toLowerCase();
          const code = parts[i + 2] || "";
          const encodedCode = encodeURIComponent(code);
          const outId = "py-out-" + i + "-" + Math.floor(Math.random() * 100000);
          const isPreviewable = lang === "html" || lang === "svg" || code.includes("<html") || code.includes("<style");
          const isPython = lang === "python" || lang === "py" || code.includes("def ") || code.includes("print(");
          const previewBtn = isPreviewable
            ? `<button class="icon-btn" style="font-size:0.75rem;" onclick="openLiveCanvas(decodeURIComponent('${encodedCode}'))">▶️ معاينة</button>`
            : (isPython ? `<button class="icon-btn" style="font-size:0.75rem;" onclick="runPythonCode(decodeURIComponent('${encodedCode}'), '${outId}')">▶️ تشغيل</button>` : "");
          const inlineSvg = lang === "svg" && code.trim().startsWith("<svg") ? `<div style="margin:0.5rem 0;">${code}</div>` : "";
          html += `${inlineSvg}<pre><div class="code-header"><span>${escapeHtml(lang)}</span><div>${previewBtn}<button class="icon-btn" style="font-size:0.75rem;" onclick="copyAnswer(decodeURIComponent('${encodedCode}'), this)">نسخ</button></div></div><code>${escapeHtml(code)}</code><div id="${outId}" style="display:none;padding:0.5rem 0.8rem;border-top:1px solid var(--border);background:#0d0d0d;color:#86efac;font-family:monospace;font-size:0.8rem;white-space:pre-wrap;"></div></pre>`;
        }
      }
      targetEl.innerHTML = html;
    }

    async function runPythonCode(codeStr, outputId) {
      const outEl = document.getElementById(outputId);
      if (!outEl) return;
      outEl.style.display = "block";
      outEl.textContent = "جاري التشغيل...";
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const res = await fetch(API_BASE + "/api/v1/code/run", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ code: codeStr })
        });
        const data = await res.json();
        if (!res.ok) {
          outEl.style.color = "#fca5a5";
          outEl.textContent = data.error || "خطأ في التشغيل";
        } else {
          outEl.style.color = data.exit_code === 0 ? "#86efac" : "#fca5a5";
          outEl.textContent = (data.stdout || data.stderr || "(تم التنفيذ بنجاح بدون مخرجات نصية)").trim();
        }
      } catch (err) {
        outEl.style.color = "#fca5a5";
        outEl.textContent = err.message;
      }
    }

    function extractBrowserMemories(text) {
      const patterns = [
        /(?:اسمي|أنا اسمي)\s+([^\n.,،!؟]{2,35})/i,
        /(?:تذكر أن|تذكر ان|لا تنس أن)\s+([^\n.!؟]{3,100})/i,
        /(?:أعمل كـ|تخصصي هو|أفضل)\s+([^\n.,،!؟]{2,60})/i,
        /(?:my name is|remember that|i work as)\s+([^\n.!?]{2,80})/i
      ];
      const existing = loadLocalMemories();
      let added = false;
      for (const pat of patterns) {
        const m = text.match(pat);
        if (m && m[1]) {
          const fact = m[1].trim();
          if (fact && !existing.includes(fact)) {
            existing.push(fact);
            added = true;
          }
        }
      }
      if (added) saveLocalMemories(existing.slice(-20));
      return added;
    }

      const isTeamMode = (document.getElementById("engine-mode-select").value === "team_ai" || persona === "team");

      }
      if (/^(ارسم خريطة ذهنية|خريطة ذهنية|mindmap)/i.test(q)) {
        const topic = q.replace(/^(ارسم خريطة ذهنية لـ|خريطة ذهنية|mindmap)[:：]?\s*/i, "").trim() || "التعلم الذكي";
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="220" style="background:#141418;border-radius:12px;"><rect x="230" y="95" width="180" height="48" rx="12" fill="#3b82f6"/><text x="320" y="124" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">${escapeHtml(topic.slice(0, 26))}</text><line x1="230" y1="119" x2="155" y2="55" stroke="#60a5fa" stroke-width="2"/><rect x="25" y="30" width="130" height="42" rx="8" fill="#1e293b" stroke="#60a5fa"/><text x="90" y="56" fill="#e2e8f0" font-size="12" text-anchor="middle">1. الأساسيات</text><line x1="230" y1="119" x2="155" y2="185" stroke="#a78bfa" stroke-width="2"/><rect x="25" y="165" width="130" height="42" rx="8" fill="#1e293b" stroke="#a78bfa"/><text x="90" y="191" fill="#e2e8f0" font-size="12" text-anchor="middle">2. الأدوات</text><line x1="410" y1="119" x2="485" y2="55" stroke="#34d399" stroke-width="2"/><rect x="485" y="30" width="130" height="42" rx="8" fill="#1e293b" stroke="#34d399"/><text x="550" y="56" fill="#e2e8f0" font-size="12" text-anchor="middle">3. التطبيق</text><line x1="410" y1="119" x2="485" y2="185" stroke="#f472b6" stroke-width="2"/><rect x="485" y="165" width="130" height="42" rx="8" fill="#1e293b" stroke="#f472b6"/><text x="550" y="191" fill="#e2e8f0" font-size="12" text-anchor="middle">4. التقييم</text></svg>`;
        return `🗺️ **الخريطة الذهنية لـ «${topic}»:**\n\n\`\`\`svg\n${svg}\n\`\`\``;
      }

      // 1. AI Council (4 sequential expert calls: Technical, Business/Strategy, Creative/UX -> 4th Synthesizer)
      if (/^(مجلس الخبراء|ai council)/i.test(q)) {
        const topic = q.replace(/^(مجلس الخبراء|ai council)[:：]?\s*/i, "").trim() || q;
        const [e1, e2, e3] = await Promise.all([

          callCloudLLM("You are Expert 2 (Financial & Market Strategist). Give a concise 2-line Arabic opinion.", topic, geminiKey),

        ]);
        const v1 = e1 || `تقنياً: موضوع «${topic}» قابل للتنفيذ بأدوات خفيفة وسريعة دون تعقيد مكلف.`;

        const v3 = e3 || `إبداعياً: تجربة المستخدم البسيطة هي ما يميز الحل ويجذب الجمهور.`;
        const synth = await callCloudLLM("You are Expert 4 (Council Chair). Synthesize these 3 expert views into a concise final recommendation in Arabic.", `${v1}\n${v2}\n${v3}`, geminiKey);
        return `🏛️ **جلسة مجلس الخبراء (AI Council — 4 استدعاءات):**\n\n` +

      if (/^(ماذا لو|what if)/i.test(q)) {
        const scenario = q.replace(/^(ماذا لو|what if)[:：]?\s*/i, "").trim() || q;

          `- **السيناريو الواقعي:** نمو تدريجي يتطلب تجريب السوق وتعديل الخطة خلال أول 30 يوماً.\n` +
          `- **المخاطر والافتراضات:** نفاد الميزانية قبل الوصول للعميل الأول، لذا اعتمد الأدوات المجانية في البداية.`;
      }

      // 4. Interactive Knowledge Graph
      if (/^(شبكة المعرفة|knowledge graph)/i.test(q)) {
        const topic = q.replace(/^(شبكة المعرفة|knowledge graph)[:：]?\s*/i, "").trim() || "الذكاء الاصطناعي";
        const kgObj = {

      // 5. Reverse AI (How could I fail?)
      if (/^(التفكير بالعكس|كيف أفشل|reverse ai)/i.test(q)) {
        const goal = q.replace(/^(التفكير بالعكس|كيف أفشل|reverse ai)[:：]?\s*/i, "").trim() || q;
        const cloudRev = await callCloudLLM("Apply Reverse Thinking (Pre-mortem): Explain 5 ways this project/goal could fail and how to prevent each mistake in Arabic.", goal, geminiKey);
        if (cloudRev) return `🔁 **التفكير بالعكس — كيف تتجنب الفشل في «${goal}»:**\n\n${cloudRev}`;
        return `🔁 **التفكير بالعكس لـ «${goal}» (أخطاء يجب تجنبها):**\n\n` +

          `- **📋 مدير المشاريع:** تقسيم التنفيذ إلى 3 سباقات (Sprints) أسبوعية بمؤشرات قياس واضحة.`;
      }

      // 7. AI Debate (Pro + Con + Final Judge)
      if (/^(مناظرة|debate)/i.test(q)) {
        const topic = q.replace(/^(مناظرة|debate)[:：]?\s*/i, "").trim() || q;
        const [pro, con] = await Promise.all([
          callCloudLLM("Argue strongly IN FAVOR of this topic in 2-3 clear sentences in Arabic.", topic, geminiKey),
          callCloudLLM("Argue strongly AGAINST this topic with counter-evidence in 2-3 clear sentences in Arabic.", topic, geminiKey)
        ]);
        const pTxt = pro || `المؤيد: «${topic}» يفتح آفاقاً جديدة للإنتاجية والسرعة والابتكار.`;
        const cTxt = con || `المعارض: الإفراط في الاعتماد على «${topic}» قد يخلق تحديات في الجودة والخصوصية.`;
        const judge = await callCloudLLM("You are the Debate Judge. Weigh both arguments and give a balanced verdict in Arabic.", `${pTxt}\n${cTxt}`, geminiKey);
        return `⚖️ **مناظرة الذكاء الاصطناعي حول «${topic}»:**\n\n` +
          `- **🟢 الطرف المؤيد:** ${pTxt}\n` +
          `- **🔴 الطرف المعارض:** ${cTxt}\n\n` +
          `---\n**🏛️ حكم القاضي النهائي:** ${judge || "المتوازن هو الاستفادة من المزايا مع وضع ضوابط جودة ومراجعة مستمرة."}`;
      }

      // 8. Smart Workflow Chain (Step-by-step with user approval)
      if (/^(سلسلة المهام|workflow)/i.test(q)) {

        const wf = {

        };
        return `[WORKFLOW_JSON]${JSON.stringify(wf)}[/WORKFLOW_JSON]`;

      // 9. Digital Twin (Mimics user's saved writing style)
      if (/^(بأسلوبي الرقمي|النسخة الرقمية|digital twin)/i.test(q)) {

      }

      const isTeamMode = (document.getElementById("engine-mode-select").value === "team_ai" || persona === "team");
      const teamInstruction = isTeamMode

      const sysPrompt = `${teamInstruction} ${lenHint} ${toneHint} User memories: ${mems.join("; ")}.`;

      // If question is short or ambiguous and no verified answer was found, ask for clarification instead of guessing
      if (q.split(/\s+/).length <= 3 || q.length < 10) {

    async function sendStreamingMessage() {
      hideError();
      const input = document.getElementById("prompt-input");
      const text = input.value.trim() || (pendingImageBase64 ? "حلل واشرح هذه الصورة بالتفصيل" : "");
      if (!text && !pendingImageBase64) return;
      const token = await ensureAuthenticated();
      if (!token) return;

      const sentImgB64 = pendingImageBase64;
      const sentImgMime = pendingImageMime;
      clearPendingAttachment();

      input.value = "";
      input.style.height = "auto";
      stopStreamingFlag = false;

      const userDisplay = sentImgB64 ? `${text}\n🖼️ [صورة مرفقة]` : text;
      appendMessageBubble("user", userDisplay);
      updateHeroVisibility();

      const selectedMode = document.getElementById("engine-mode-select").value;
      const enableWebSearch = selectedMode === "web_ai" || selectedMode === "team_ai";
      const useFallback = selectedMode === "fallback" || selectedMode === "web_ai" || selectedMode === "team_ai";
      const geminiKey = (document.getElementById("gemini-key-input").value || "").trim();
      const assistantObj = appendMessageBubble("assistant", "");

      document.getElementById("send-btn").style.display = "none";
      document.getElementById("stop-btn").style.display = "flex";

      try {
        let replyText = "";
        let payload = null;
        if (backendOnline) {
          try {
            let reqBody = {
              session_id: activeSessionId,
              language: currentLanguage,
              message: text,
              enable_web_search: enableWebSearch,
              use_fallback_assistant: useFallback,
              gemini_api_key: geminiKey,
              persona: document.getElementById("persona-select").value,
              strategy: document.getElementById("strategy-select").value,
              temperature: parseFloat(document.getElementById("temperature-input").value),
              top_k: parseInt(document.getElementById("top-k-input").value, 10),
              top_p: parseFloat(document.getElementById("top-p-input").value),
              max_new_tokens: parseInt(document.getElementById("max-tokens-input").value, 10)
            };
            let response = await fetch(API_BASE + "/api/v1/chat/stream", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              },
              body: JSON.stringify(reqBody)
            });
            if (response.status === 404 && activeSessionId) {
              activeSessionId = null;
              setCookie("nourai_active_session", "", -1);
              reqBody.session_id = null;
              response = await fetch(API_BASE + "/api/v1/chat/stream", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + token
                },
                body: JSON.stringify(reqBody)
              });
            }
            if (!response.ok) throw new Error("HTTP " + response.status);
            payload = await response.json();
          } catch (netErr) {
            if (API_BASE !== "") {
              activateServerlessFallback();
            } else {
              throw netErr;
            }
          }
        }

        if (payload && payload.stream_chunks && !sentImgB64) {
          activeSessionId = payload.session_id || activeSessionId;
          setCookie("nourai_active_session", activeSessionId, 7);
          let fullStreamed = "";
          for (const chunk of payload.stream_chunks) {
            if (stopStreamingFlag) break;
            fullStreamed += chunk.text_delta;
            renderFormattedContent(assistantObj.textNode, fullStreamed);
            const container = document.getElementById("chat-messages");
            container.scrollTop = container.scrollHeight;
            await new Promise(r => setTimeout(r, 12));
          }
          if (document.getElementById("auto-voice-toggle").checked) speakText(fullStreamed);
        } else {
          replyText = await generateBrowserReply(text, geminiKey, sentImgB64, sentImgMime);
          renderFormattedContent(assistantObj.textNode, replyText);
          if (document.getElementById("auto-voice-toggle").checked) speakText(replyText);
          const localList = loadLocalSessions();
          if (!activeSessionId) {
            activeSessionId = "local_" + Date.now();
            localList.unshift({ session_id: activeSessionId, title: text.slice(0, 36), messages: [] });
          }
          const targetSess = localList.find(s => s.session_id === activeSessionId);
          if (targetSess) {
            targetSess.messages.push({ role: "user", content: userDisplay }, { role: "assistant", content: replyText });
            saveLocalSessions(localList);
          }
        }
        renderFollowUpChips(assistantObj.bubble, text);
        await refreshSessionList();
        await refreshMemoriesAndDocs();
      } catch (err) {
        showError(err.message);
      }
      document.getElementById("send-btn").style.display = "flex";
      document.getElementById("stop-btn").style.display = "none";
    }

    function copyAnswer(text, btnEl) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      }
      const prev = btnEl.textContent;
      btnEl.textContent = I18N[currentLanguage].copied;
      setTimeout(() => { btnEl.textContent = prev; }, 1200);
    }

    function appendMessageBubble(role, text) {
      const container = document.getElementById("chat-messages");
      const row = document.createElement("div");
      row.className = "message-row row-" + role;

      const div = document.createElement("div");
      div.className = "message-bubble message-" + role;
      div.setAttribute("dir", "auto");

      const textSpan = document.createElement("div");
      textSpan.className = "msg-content";
      renderFormattedContent(textSpan, text);
      div.appendChild(textSpan);

      if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "bubble-actions";
        actions.style.flexWrap = "wrap";
        const mkBtn = (label, title, onClickFn) => {
          const b = document.createElement("button");
          b.className = "icon-btn";
          b.style.fontSize = "0.75rem";
          b.textContent = label;
          if (title) b.title = title;
          b.onclick = () => onClickFn(b);
          return b;
        };
        actions.appendChild(mkBtn(I18N[currentLanguage].copy, "نسخ", (b) => copyAnswer(textSpan.dataset.raw || textSpan.textContent, b)));
        actions.appendChild(mkBtn("🔊", "استماع", () => speakText(textSpan.dataset.raw || textSpan.textContent)));
        actions.appendChild(mkBtn("🔄 صياغة", "إعادة صياغة الإجابة", () => transformReplyAction("rephrase", textSpan)));
        actions.appendChild(mkBtn("📖 مصطلحات", "شرح المصطلحات الصعبة", () => transformReplyAction("terms", textSpan)));
        actions.appendChild(mkBtn("📊 جدول", "تحويل الإجابة إلى جدول", () => transformReplyAction("table", textSpan)));
        actions.appendChild(mkBtn("📋 قائمة", "تحويل الإجابة إلى قائمة", () => transformReplyAction("list", textSpan)));
        actions.appendChild(mkBtn("⭐", "حفظ في المفضلة", (b) => saveFavoriteAnswer(textSpan.dataset.raw || textSpan.textContent, b)));
        actions.appendChild(mkBtn("🧹 تنسيق ذكي", "Clean Answer: تنسيق الإجابة وحذف التكرار", () => renderFormattedContent(textSpan, cleanAnswerText(textSpan.dataset.raw || textSpan.textContent))));
        actions.appendChild(mkBtn("🔍 مراجعة ذكية", "المراجع الذكي: فحص الأخطاء والنواقص واقتراح تحسينات", () => runSmartCriticReview(textSpan)));
        actions.appendChild(mkBtn("📄 PDF", "تنزيل كـ PDF", () => window.print()));
        div.appendChild(actions);
      }

      if (role === "assistant") {
        const av = document.createElement("span");
        av.className = "assistant-avatar";
        av.textContent = "✦";
        row.appendChild(av);
      }
      row.appendChild(div);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return { bubble: div, textNode: textSpan };
    }

    function loadFavorites() {
      try { return JSON.parse(localStorage.getItem("nourai_favorites") || "[]"); } catch (e) { return []; }
    }

    function saveFavoriteAnswer(rawText, btnEl) {
      const text = (rawText || "").trim();
      if (!text) return;
      const favs = loadFavorites();
      if (!favs.some(f => f.text === text)) {
        favs.unshift({ id: "fav_" + Date.now(), text, savedAt: new Date().toLocaleDateString("ar") });
        localStorage.setItem("nourai_favorites", JSON.stringify(favs.slice(0, 40)));
      }
      if (btnEl) {
        btnEl.textContent = "⭐ محفوظ";
        setTimeout(() => { btnEl.textContent = "⭐"; }, 1400);
      }
    }

    function toggleFavoritesView() {
      const favs = loadFavorites();
      const container = document.getElementById("chat-messages");
      container.innerHTML = "";
      updateHeroVisibility();
      if (!favs.length) {
        appendMessageBubble("assistant", "⭐ لا توجد إجابات محفوظة في المفضلة بعد. اضغط على زر **⭐** أسفل أي إجابة لحفظها هنا.");
      } else {
        const joined = "⭐ **الإجابات المحفوظة في المفضلة:**\n\n" + favs.map((f, i) => `**${i + 1}. (${f.savedAt})**\n${f.text}`).join("\n\n---\n\n");
        appendMessageBubble("assistant", joined);
      }
      updateHeroVisibility();
      closeSidebarMobile();
    }

    function renderFollowUpChips(bubbleEl, userQuestion) {
      if (!bubbleEl) return;
      const old = bubbleEl.querySelector(".followup-chips");
      if (old) old.remove();
      const qShort = (userQuestion || "").replace(/[؟?!.]+$/, "").slice(0, 32);
      const suggestions = [
        `اشرح لي «${qShort}» بمثال عملي`,
        `لخّص أهم نقاط «${qShort}» في جدول`,
        `ما هي الخطوة التالية لتطبيق «${qShort}»؟`
      ];
      const wrap = document.createElement("div");
      wrap.className = "followup-chips";
      wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.65rem;";
      for (const s of suggestions) {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.style.cssText = "padding:0.35rem 0.7rem;font-size:0.78rem;border-radius:999px;";
        btn.textContent = "↳ " + s;
        btn.onclick = () => useStarterPrompt(s);
        wrap.appendChild(btn);
      }
      bubbleEl.appendChild(wrap);
    }

    async function runSmartCriticReview(textEl) {
      const raw = (textEl.dataset.raw || textEl.textContent || "").trim();
      if (!raw) return;
      const geminiKey = (document.getElementById("gemini-key-input")?.value || "").trim();
      const critique = await callCloudLLM(
        "You are an AI Critic & Reviewer. Inspect the following answer for gaps, contradictions, or missing details, and suggest 2 concrete improvements in Arabic.",
        raw.slice(0, 1500),
        geminiKey
      );
      const reviewTxt = critique || "لا توجد تناقضات منطقية؛ يمكن تعزيز الإجابة بإضافة مثال عملي أو رقم مرجعي للوضوح.";
      renderFormattedContent(textEl, raw + `\n\n---\n🔍 **تقرير المراجع الذكي (Critic Review):**\n${reviewTxt}`);
    }

    function transformReplyAction(mode, textEl) {
      const raw = (textEl.dataset.raw || textEl.textContent || "").trim();
      if (!raw) return;
      if (mode === "rephrase") {
        const sentences = raw.split(/[.!؟\n]+/).map(s => s.trim()).filter(Boolean);
        renderFormattedContent(textEl, "🔄 **الإجابة بصياغة جديدة أوضح:**\n\n" + sentences.map(s => "• " + s).join("\n"));
      } else if (mode === "terms") {
        renderFormattedContent(textEl, raw + "\n\n---\n📖 **شرح المصطلحات الصعبة:**\n- **الذكاء الاصطناعي / الخوارزمية:** خطوات برمجية ذكية تحلل البيانات لاتخاذ قرار دقيق.\n- **الاستنتاج / السياق:** فهم المعنى المقصود من الجملة وربطه بالمعلومات السابقة.");
      } else if (mode === "table") {
        const lines = raw.split(/\n+/).map(l => l.replace(/^[-*•\d.]+\s*/, "").trim()).filter(Boolean).slice(0, 6);
        let tbl = "📊 **الإجابة بصيغة جدول منظم:**\n\n";
        lines.forEach((l, idx) => { tbl += `| **البند ${idx + 1}** | ${l} |\n`; });
        renderFormattedContent(textEl, tbl);
      } else if (mode === "list") {
        const lines = raw.split(/[.!؟\n]+/).map(l => l.replace(/^[-*•\d.]+\s*/, "").trim()).filter(Boolean);
        renderFormattedContent(textEl, "📋 **الإجابة في قائمة مرتبة:**\n\n" + lines.map((l, i) => `${i + 1}. ${l}`).join("\n"));
      }
    }

    function createNewSession() {
      activeSessionId = null;
      setCookie("nourai_active_session", "", -1);
      document.getElementById("chat-messages").innerHTML = "";
      updateHeroVisibility();
      renderSessionList();
    }

    function openLiveCanvas(codeStr) {
      document.getElementById("live-canvas-iframe").srcdoc = codeStr;
      document.getElementById("live-canvas-modal").style.display = "flex";
    }

    function closeLiveCanvas() {
      document.getElementById("live-canvas-iframe").srcdoc = "";
      document.getElementById("live-canvas-modal").style.display = "none";
    }

    async function refreshMemoriesAndDocs() {
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const mRes = await fetch(API_BASE + "/api/v1/memories", { headers: { "Authorization": "Bearer " + token } });
        if (mRes.ok) {
          const mData = await mRes.json();
          const mems = mData.memories || [];
          document.getElementById("memories-list").textContent = mems.length ? mems.map(m => m.fact).join(" · ") : "—";
        }
      } catch (e) {}
    }

    function speakText(text) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/```[\s\S]*?```/g, "").replace(/[*#_`]/g, "").replace(/https?:\/\/\S+/g, "");
      const utter = new SpeechSynthesisUtterance(clean.slice(0, 600));
      utter.lang = currentLanguage === "arabic" ? "ar-SA" : (currentLanguage === "french" ? "fr-FR" : "en-US");
      window.speechSynthesis.speak(utter);
    }

    function startVoiceInput() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        showError("المتصفح لا يدعم الإدخال الصوتي المباشر.");
        return;
      }
      const rec = new SpeechRec();
      rec.lang = currentLanguage === "arabic" ? "ar-SA" : (currentLanguage === "french" ? "fr-FR" : "en-US");
      const micBtn = document.getElementById("mic-btn");
      if (micBtn) micBtn.style.color = "#ef4444";
      rec.onend = () => { if (micBtn) micBtn.style.color = ""; };
      rec.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript;
        const input = document.getElementById("prompt-input");
        input.value = (input.value ? input.value + " " : "") + transcript;
        autoResizeTextarea(input);
      };
      rec.start();
    }

    function clearPendingAttachment() {
      pendingImageBase64 = "";
      pendingImageMime = "";
      pendingImageName = "";
      const bar = document.getElementById("attachment-preview-bar");
      const thumb = document.getElementById("attachment-thumb");
      if (bar) bar.style.display = "none";
      if (thumb) { thumb.src = ""; thumb.style.display = "none"; }
    }

    async function extractPdfTextBrowser(arrayBuffer) {
      if (!window.pdfjsLib) {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";
      const maxPages = Math.min(pdf.numPages, 25);
      for (let i = 1; i <= maxPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(it => it.str).join(" ") + "\n";
      }
      return fullText.trim();
    }

    async function handleFileUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const lowerName = file.name.toLowerCase();
        if (file.type.startsWith("image/") || /\.(png|jpe?g|webp|gif)$/i.test(lowerName)) {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = String(reader.result || "");
            const parts = dataUrl.split(",");
            pendingImageBase64 = parts[1] || "";
            pendingImageMime = file.type || "image/jpeg";
            pendingImageName = file.name;
            const bar = document.getElementById("attachment-preview-bar");
            const thumb = document.getElementById("attachment-thumb");
            document.getElementById("attachment-name").textContent = "🖼️ " + file.name;
            thumb.src = dataUrl;
            thumb.style.display = "block";
            bar.style.display = "flex";
          };
          reader.readAsDataURL(file);
          inputEl.value = "";
          return;
        }

        if (!backendOnline) {
          let docText = "";
          if (lowerName.endsWith(".pdf")) {
            docText = await extractPdfTextBrowser(await file.arrayBuffer());
          } else {
            docText = await file.text();
          }
          const chunks = [];
          for (let i = 0; i < docText.length && chunks.length < 40; i += 600) {
            chunks.push(docText.slice(i, i + 600));
          }
          const docs = loadLocalDocs().filter(d => d.filename !== file.name);
          docs.unshift({ filename: file.name, chunks });
          saveLocalDocs(docs.slice(0, 5));
          document.getElementById("prompt-input").value = `لخص ما ورد في الملف المرفق (${file.name})`;
          inputEl.value = "";
          return;
        }

        let payloadBody = { filename: file.name };
        if (lowerName.endsWith(".docx") || lowerName.endsWith(".pdf")) {
          const buf = await file.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let binary = "";
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          payloadBody.content_base64 = btoa(binary);
        } else {
          payloadBody.content = await file.text();
        }
        const res = await fetch(API_BASE + "/api/v1/documents", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify(payloadBody)
        });
        if (res.ok) {
          document.getElementById("prompt-input").value = `لخص ما ورد في الملف المرفق (${file.name})`;
        } else {
          const err = await res.json();
          showError(err.error || "فشل قراءة الملف");
        }
      } catch (err) {
        showError(err.message);
      }
      inputEl.value = "";
    }

    window.addEventListener("DOMContentLoaded", async () => {
      if (!getCookie("nourai_cookies_accepted")) {
        document.getElementById("cookie-banner").style.display = "flex";
      }
      const savedTheme = getCookie("nourai_theme");
      if (savedTheme === "light") document.getElementById("html-root").setAttribute("data-theme", "light");
      const savedLang = getCookie("nourai_lang");
      if (savedLang && I18N[savedLang]) {
        document.getElementById("language-selector").value = savedLang;
        switchLanguage(savedLang);
      }
      const savedMode = getCookie("nourai_mode");
      if (savedMode) {
        document.getElementById("engine-mode-select").value = savedMode;
      }
      const savedKey = getCookie("nourai_gemini_key");
      if (savedKey) {
        document.getElementById("gemini-key-input").value = savedKey;
      }
      const savedPersona = getCookie("nourai_persona");
      if (savedPersona) {
        document.getElementById("persona-select").value = savedPersona;
      }
      const savedAutoVoice = getCookie("nourai_auto_voice");
      if (savedAutoVoice === "1") {
        document.getElementById("auto-voice-toggle").checked = true;
      }
      const savedLen = getCookie("nourai_length");
      if (savedLen && document.getElementById("reply-length-select")) {
        document.getElementById("reply-length-select").value = savedLen;
      }
      const savedTone = getCookie("nourai_tone");
      if (savedTone && document.getElementById("reply-tone-select")) {
        document.getElementById("reply-tone-select").value = savedTone;
      }
      await refreshSessionList();
      const savedSess = getCookie("nourai_active_session");
      if (savedSess) {
        await selectSession(savedSess);
      }
      await refreshMemoriesAndDocs();
      updateHeroVisibility();
    });
  </script>
</body>
