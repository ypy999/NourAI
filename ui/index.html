<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NourAI" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="google-site-verification" content="googleba5e2e501ed82fe6" />
  <meta name="google-site-verification" content="d1hgHSrz7rNQO4_8yL8cb1md45P1GtW2ekbQQY0xELc" />
  <meta name="description" content="NourAI — مساعد ذكاء اصطناعي متعدد اللغات يدعم العربية والإنجليزية والفرنسية" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#212121" />
  <title>NourAI</title>
  <style>
    :root {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-pill: #2f2f2f;
      --bg-hover: #2a2a2a;
      --bg-user-msg: #303030;
      --text-main: #ececec;
      --text-muted: #9b9b9b;
      --border: #383838;
      --btn-main: #ffffff;
      --btn-text: #0d0d0d;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", Tahoma, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    button, select, textarea, input {
      font-family: inherit;
    }

    select option {
      background: #171717;
      color: #ececec;
    }

    /* ---------- Sidebar ---------- */
    aside.sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      gap: 0.25rem;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.2s ease, padding 0.2s ease, transform 0.25s ease;
    }

    body.hide-sidebar aside.sidebar {
      width: 0;
      padding: 0;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      color: #171717;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .sidebar-close {
      display: none;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.75rem;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-align: start;
    }

    .new-chat-btn:hover {
      background: var(--bg-hover);
    }

    .new-chat-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-section {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 0.9rem 0.75rem 0.3rem 0.75rem;
    }

    .session-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      overflow-y: auto;
      flex: 1;
    }

    .session-item {
      padding: 0.6rem 0.75rem;
      border-radius: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .session-item:hover, .session-item.active {
      background: var(--bg-hover);
    }

    .session-title {
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      unicode-bidi: plaintext;
    }

    .session-actions {
      display: none;
      gap: 0.1rem;
    }

    .session-item:hover .session-actions {
      display: flex;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 80;
    }

    /* ---------- Main ---------- */
    main.chat-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    header.chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      padding-top: calc(0.5rem + var(--sat));
      min-height: 56px;
      background: var(--bg-main);
    }

    .hdr-start, .hdr-end {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      min-width: 0;
    }

    .model-select, .lang-select {
      background: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 0.6rem;
      padding: 0.5rem 0.6rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 38vw;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lang-select {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .model-select:hover, .lang-select:hover {
      background: var(--bg-hover);
    }

    .icon-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      min-width: 40px;
      height: 40px;
      padding: 0 0.55rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .code-header .icon-btn,
    .bubble-actions .icon-btn,
    .session-actions .icon-btn {
      min-width: 0;
      height: 28px;
      padding: 0 0.5rem;
      font-size: 0.78rem;
    }

    #model-status-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0 0.4rem;
    }

    #error-banner {
      display: none;
      background: #3b1c1c;
      color: #fca5a5;
      padding: 0.5rem 1rem;
      font-size: 0.88rem;
      justify-content: space-between;
      align-items: center;
    }

    /* ---------- Welcome ---------- */
    #welcome-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      text-align: center;
    }

    .hero-greeting {
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      max-width: 640px;
    }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 999px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chip:hover {
      background: var(--bg-hover);
    }

    /* ---------- Messages ---------- */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
    }

    #chat-messages:empty {
      display: none;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.row-user {
      justify-content: flex-end;
    }

    .message-bubble {
      line-height: 1.75;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
      font-size: 1rem;
    }

    .message-user {
      background: var(--bg-user-msg);
      padding: 0.65rem 1.1rem;
      border-radius: 1.4rem;
      max-width: 80%;
    }

    .message-assistant {
      width: 100%;
      padding: 0.1rem 0;
      min-width: 0;
    }

    .message-assistant .msg-content:empty::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ececec;
      vertical-align: middle;
      animation: nourai-pulse 1s ease-in-out infinite;
    }

    @keyframes nourai-pulse {
      0%, 100% { transform: scale(0.7); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    .msg-content pre {
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      margin: 0.75rem 0;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0.75rem;
      background: #1d1d1d;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .msg-content pre code {
      display: block;
      padding: 0.8rem;
      font-family: Consolas, "SF Mono", monospace;
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .generated-img {
      max-width: 100%;
      height: auto;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      margin: 0.6rem 0;
      display: block;
    }

    .msg-content svg {
      max-width: 100%;
      height: auto;
    }

    .bubble-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.25rem;
      opacity: 0.7;
    }

    .bubble-actions:hover {
      opacity: 1;
    }

    /* ---------- Composer ---------- */
    .composer-wrap {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: 0.25rem 0.75rem calc(0.5rem + var(--sab)) 0.75rem;
    }

    .composer-pill {
      display: flex;
      align-items: flex-end;
      gap: 0.25rem;
      background: var(--bg-pill);
      border-radius: 1.75rem;
      padding: 0.4rem 0.5rem;
    }

    textarea#prompt-input {
      flex: 1;
      min-height: 40px;
      max-height: 200px;
      padding: 0.55rem 0.4rem;
      border: none;
      background: transparent;
      color: var(--text-main);
      resize: none;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      unicode-bidi: plaintext;
    }

    textarea#prompt-input::placeholder {
      color: #8e8e8e;
    }

    .send-circle-btn, .stop-circle-btn {
      width: 36px;
      height: 36px;
      margin: 2px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #0d0d0d;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .send-circle-btn {
      display: flex;
    }

    .stop-circle-btn {
      display: none;
    }

    .send-circle-btn svg, .stop-circle-btn svg {
      width: 18px;
      height: 18px;
    }

    .composer-pill:has(textarea:placeholder-shown) .send-circle-btn {
      opacity: 0.35;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding-top: 0.5rem;
    }

    /* ---------- Settings ---------- */
    aside.settings-panel {
      display: none;
      position: fixed;
      top: 56px;
      inset-inline-end: 12px;
      width: 300px;
      max-height: calc(100dvh - 72px);
      overflow-y: auto;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    aside.settings-panel.open {
      display: flex;
    }

    aside.settings-panel .new-chat-btn {
      border: 1px solid var(--border);
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .control-group select, .control-group input {
      padding: 0.55rem 0.65rem;
      border-radius: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text-main);
      font-size: 16px;
    }

    /* ---------- Cookie banner ---------- */
    #cookie-banner {
      display: none;
      position: fixed;
      bottom: 16px;
      inset-inline: 16px;
      max-width: 540px;
      margin: 0 auto;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--text-main);
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 200;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cookie-accept-btn {
      background: var(--btn-main);
      color: var(--btn-text);
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ---------- Touch devices ---------- */
    @media (hover: none) {
      .session-actions {
        display: flex;
      }
    }

    /* ---------- Mobile (no desktop mode needed) ---------- */
    @media (max-width: 768px) {
      aside.sidebar,
      body.hide-sidebar aside.sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        width: min(82vw, 300px);
        z-index: 90;
        padding: calc(0.5rem + var(--sat)) 0.5rem calc(0.5rem + var(--sab)) 0.5rem;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }

      [dir="rtl"] aside.sidebar {
        transform: translateX(100%);
      }

      [dir="ltr"] aside.sidebar {
        transform: translateX(-100%);
      }

      body.sidebar-open aside.sidebar {
        transform: none;
      }

      body.sidebar-open .sidebar-overlay {
        display: block;
      }

      .sidebar-close {
        display: inline-flex;
      }

      #model-status-badge {
        display: none;
      }

      .hero-greeting {
        font-size: 1.5rem;
      }

      .message-user {
        max-width: 88%;
      }

      #chat-messages {
        padding: 0.75rem 0.9rem 1.25rem 0.9rem;
      }

      aside.settings-panel {
        top: auto;
        bottom: 0;
        inset-inline: 0;
        width: 100%;
        max-height: 80dvh;
        border-radius: 1.25rem 1.25rem 0 0;
        padding-bottom: calc(1rem + var(--sab));
      }

      #cookie-banner {
        bottom: calc(96px + var(--sab));
        inset-inline: 10px;
      }
    }

    @media print {
      aside.sidebar, .sidebar-overlay, header.chat-header, .composer-wrap, aside.settings-panel, #cookie-banner, #welcome-hero, .bubble-actions {
        display: none !important;
      }
      body, main.chat-area, #chat-messages {
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarMobile()"></div>

  <aside class="sidebar" id="sidebar-panel" aria-label="Conversation History">
    <div class="sidebar-top">
      <div class="brand"><span class="brand-logo">✦</span><span>NourAI</span></div>
      <button class="icon-btn sidebar-close" onclick="toggleSidebar()" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="new-chat-btn" id="new-session-btn" onclick="createNewSession(); closeSidebarMobile();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span id="new-session-label">محادثة جديدة</span>
    </button>
    <div class="sidebar-section" id="ui-history-title">المحادثات</div>
    <ul class="session-list" id="session-history-list"></ul>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div class="hdr-start">
        <button class="icon-btn" onclick="toggleSidebar()" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <select id="engine-mode-select" class="model-select" onchange="saveModeCookie()" aria-label="النموذج">
          <option value="web_ai">NourAI ويب</option>
          <option value="neural">NourAI عصبي</option>
          <option value="fallback">NourAI محلي</option>
        </select>
        <span id="model-status-badge">متصل</span>
        <span id="stream-status-indicator" style="display:none;">جاهز</span>
        <span id="ui-app-title" style="display:none;">NourAI</span>
      </div>
      <div class="hdr-end">
        <select id="language-selector" class="lang-select" onchange="switchLanguage(this.value)" aria-label="اللغة">
          <option value="arabic">العربية</option>
          <option value="english">English</option>
          <option value="french">Français</option>
        </select>
        <button class="icon-btn" onclick="createNewSession()" aria-label="محادثة جديدة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button class="icon-btn" onclick="toggleSettings()" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      </div>
    </header>

    <div id="error-banner" role="alert">
      <span id="error-banner-text"></span>
      <button class="icon-btn" onclick="hideError()">✕</button>
    </div>

    <div id="welcome-hero">
      <h1 class="hero-greeting" id="hero-title">كيف يمكنني مساعدتك اليوم؟</h1>
      <div class="quick-chips">
        <button class="chip" onclick="useStarterPrompt('ارسم لي مدينة عربية مستقبلية')">🎨 ارسم صورة</button>
        <button class="chip" onclick="useStarterPrompt('ابحث في قوقل عن الذكاء الاصطناعي')">🌐 ابحث في الويب</button>
        <button class="chip" onclick="useStarterPrompt('اكتب دالة بايثون لحساب مضروب العدد factorial')">💻 اكتب كوداً</button>
        <button class="chip" onclick="useStarterPrompt('لخص النص: الذكاء الاصطناعي يغيّر طريقة عملنا وتعلمنا ويفتح فرصاً جديدة في كل المجالات.')">📝 لخّص نصاً</button>
      </div>
    </div>

    <section id="chat-messages" aria-live="polite"></section>

    <footer class="composer-wrap">
      <div class="composer-pill">
        <input type="file" id="doc-upload-input" accept=".txt,.md,.json,.csv,.py,.js,.html,.log,.docx,.pdf" style="display:none;" onchange="handleFileUpload(this)" />
        <button class="icon-btn" onclick="document.getElementById('doc-upload-input').click()" aria-label="إرفاق ملف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <textarea
          id="prompt-input"
          dir="auto"
          rows="1"
          placeholder="اسأل NourAI..."
          enterkeyhint="send"
          onkeydown="handleComposerKeydown(event)"
          oninput="autoResizeTextarea(this)"
        ></textarea>
        <button class="send-circle-btn" id="send-btn" onclick="sendStreamingMessage()" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <button class="stop-circle-btn" id="stop-btn" onclick="stopGeneration()" aria-label="إيقاف"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
      <p class="disclaimer">قد يخطئ NourAI. تحقق من المعلومات المهمة.</p>
    </footer>
  </main>

  <!-- Popover Settings (Hidden by default) -->
  <aside class="settings-panel" id="settings-panel" aria-label="Model Settings">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong id="ui-settings-title" style="font-size:0.88rem;">الإعدادات</strong>
      <button class="icon-btn" onclick="toggleSettings()">✕</button>
    </div>
    <div class="control-group">
      <label for="persona-select">الشخصية / الدور (Persona)</label>
      <select id="persona-select" onchange="setCookie('nourai_persona', this.value, 90)">
        <option value="general">مساعد عام (افتراضي)</option>
        <option value="coder">مبرمج ومهندس برمجيات</option>
        <option value="teacher">معلم لغات وشرح مبسط</option>
        <option value="writer">مدقق لغوي وكاتب أكاديمي</option>
      </select>
    </div>
    <div class="control-group">
      <label for="strategy-select">استراتيجية التوليد</label>
      <select id="strategy-select">
        <option value="greedy">Greedy</option>
        <option value="top_p">Top-P</option>
        <option value="top_k">Top-K</option>
        <option value="temperature">Temperature</option>
      </select>
    </div>
    <div class="control-group">
      <label for="temperature-input">Temperature</label>
      <input type="number" id="temperature-input" value="0.7" min="0.1" max="2.0" step="0.1" />
    </div>
    <div class="control-group">
      <label for="top-k-input">Top-K</label>
      <input type="number" id="top-k-input" value="16" min="1" max="100" step="1" />
    </div>
    <div class="control-group">
      <label for="top-p-input">Top-P</label>
      <input type="number" id="top-p-input" value="0.9" min="0.1" max="1.0" step="0.05" />
    </div>
    <div class="control-group">
      <label for="max-tokens-input">Max Tokens</label>
      <input type="number" id="max-tokens-input" value="160" min="4" max="256" step="8" />
    </div>
    <div class="control-group">
      <label for="gemini-key-input">Gemini API Key (اختياري)</label>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." onchange="setCookie('nourai_gemini_key', this.value, 30)" />
    </div>
    <div class="control-group">
      <span>الذاكرة المحفوظة:</span>
      <div id="memories-list" style="font-size:0.75rem;color:var(--text-main);">—</div>
      <div id="rag-docs-list" style="font-size:0.75rem;color:var(--text-main);"></div>
    </div>
    <button class="new-chat-btn" onclick="window.print()" style="justify-content:center;margin-top:0.25rem;">📄 حفظ المحادثة PDF</button>
  </aside>

  <!-- Live HTML Preview Modal -->
  <div id="live-canvas-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;justify-content:center;align-items:center;padding:1.5rem;">
    <div style="background:var(--bg-sidebar);border:1px solid var(--border);border-radius:0.75rem;width:min(860px,95vw);height:min(600px,85vh);display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:0.6rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <strong>معاينة الكود</strong>
        <button class="icon-btn" onclick="closeLiveCanvas()">✕</button>
      </div>
      <iframe id="live-canvas-iframe" sandbox="allow-scripts" style="flex:1;width:100%;border:none;background:#fff;"></iframe>
    </div>
  </div>

  <!-- Cookie Consent Banner -->
  <div id="cookie-banner" role="region" aria-label="Cookie Consent">
    <span>🍪 نستخدم ملفات تعريف الارتباط (Cookies) لحفظ جلستك ولغتك وإعداداتك تلقائياً.</span>
    <button class="cookie-accept-btn" onclick="acceptCookies()">موافق</button>
  </div>

  <script>
    const I18N = {
      arabic: {
        dir: "rtl",
        lang: "ar",
        heroTitle: "كيف يمكنني مساعدتك اليوم؟",
        history: "المحادثات",
        newSession: "محادثة جديدة",
        placeholder: "اسأل NourAI...",
        copy: "نسخ",
        copied: "تم النسخ ✓",
        renamePrompt: "الاسم الجديد للمحادثة:"
      },
      english: {
        dir: "ltr",
        lang: "en",
        heroTitle: "What can I help with?",
        history: "Chats",
        newSession: "New chat",
        placeholder: "Ask NourAI...",
        copy: "Copy",
        copied: "Copied ✓",
        renamePrompt: "New chat title:"
      },
      french: {
        dir: "ltr",
        lang: "fr",
        heroTitle: "Comment puis-je vous aider ?",
        history: "Discussions",
        newSession: "Nouvelle discussion",
        placeholder: "Posez une question...",
        copy: "Copier",
        copied: "Copié ✓",
        renamePrompt: "Nouveau titre :"
      }
    };

    const API_BASE = (window.location.hostname.endsWith("web.app") || window.location.hostname.endsWith("firebaseapp.com"))
      ? "https://nourai-studio.onrender.com"
      : "";
    let currentLanguage = "arabic";
    let sessions = [];
    let activeSessionId = null;
    let authToken = null;
    let stopStreamingFlag = false;

    /* Cookie Helper Functions */
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + encodeURIComponent(value || "") + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax";
    }

    function getCookie(name) {
      const prefix = name + "=";
      const parts = document.cookie.split(";");
      for (let i = 0; i < parts.length; i++) {
        const c = parts[i].trim();
        if (c.indexOf(prefix) === 0) {
          return decodeURIComponent(c.substring(prefix.length));
        }
      }
      return "";
    }

    function acceptCookies() {
      setCookie("nourai_cookies_accepted", "1", 365);
      document.getElementById("cookie-banner").style.display = "none";
    }

    function saveModeCookie() {
      setCookie("nourai_mode", document.getElementById("engine-mode-select").value, 90);
    }

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      document.getElementById("error-banner-text").textContent = msg;
      banner.style.display = "flex";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function isMobileLayout() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function toggleSidebar() {
      if (isMobileLayout()) {
        document.body.classList.toggle("sidebar-open");
      } else {
        document.body.classList.toggle("hide-sidebar");
      }
    }

    function closeSidebarMobile() {
      document.body.classList.remove("sidebar-open");
    }

    function toggleSettings() {
      document.getElementById("settings-panel").classList.toggle("open");
    }

    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 150) + "px";
    }

    function handleComposerKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendStreamingMessage();
      }
    }

    function useStarterPrompt(text) {
      const input = document.getElementById("prompt-input");
      input.value = text;
      sendStreamingMessage();
    }

    async function ensureAuthenticated() {
      if (authToken) return authToken;
      const savedToken = getCookie("nourai_token");
      if (savedToken) {
        authToken = savedToken;
        return authToken;
      }
      try {
        const res = await fetch(API_BASE + "/api/v1/auth/guest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        if (!res.ok) throw new Error("Authentication failed (" + res.status + ")");
        const data = await res.json();
        authToken = data.access_token;
        setCookie("nourai_token", authToken, 7);
        return authToken;
      } catch (err) {
        showError(err.message);
        return null;
      }
    }

    async function refreshSessionList() {
      let token = await ensureAuthenticated();
      if (!token) return;
      try {
        let res = await fetch(API_BASE + "/api/v1/sessions", {
          headers: { "Authorization": "Bearer " + token }
        });
        if (res.status === 401) {
          authToken = null;
          activeSessionId = null;
          setCookie("nourai_token", "", -1);
          setCookie("nourai_active_session", "", -1);
          token = await ensureAuthenticated();
          if (!token) return;
          res = await fetch(API_BASE + "/api/v1/sessions", {
            headers: { "Authorization": "Bearer " + token }
          });
        }
        if (!res.ok) return;
        const data = await res.json();
        sessions = data.sessions || [];
        if (activeSessionId && !sessions.some(s => s.session_id === activeSessionId)) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
        }
        renderSessionList();
      } catch (err) {
        showError(err.message);
      }
    }

    function getPinnedSet() {
      const raw = getCookie("nourai_pinned_sessions");
      return new Set(raw ? raw.split(",").filter(Boolean) : []);
    }

    function togglePinSession(sessionId) {
      const pinned = getPinnedSet();
      if (pinned.has(sessionId)) pinned.delete(sessionId);
      else pinned.add(sessionId);
      setCookie("nourai_pinned_sessions", Array.from(pinned).join(","), 180);
      renderSessionList();
    }

    function renderSessionList() {
      const list = document.getElementById("session-history-list");
      list.innerHTML = "";
      const pinned = getPinnedSet();
      const sorted = [...sessions].sort((a, b) => (pinned.has(b.session_id) ? 1 : 0) - (pinned.has(a.session_id) ? 1 : 0));
      for (const s of sorted) {
        const isPinned = pinned.has(s.session_id);
        const li = document.createElement("li");
        li.className = "session-item" + (s.session_id === activeSessionId ? " active" : "");

        const titleSpan = document.createElement("span");
        titleSpan.className = "session-title";
        titleSpan.textContent = (isPinned ? "📌 " : "") + (s.title || s.session_id);
        titleSpan.onclick = () => { selectSession(s.session_id); closeSidebarMobile(); };

        const actions = document.createElement("div");
        actions.className = "session-actions";

        const pinBtn = document.createElement("button");
        pinBtn.className = "icon-btn";
        pinBtn.style.fontSize = "0.72rem";
        pinBtn.textContent = "📌";
        pinBtn.title = "تثبيت";
        pinBtn.onclick = (e) => { e.stopPropagation(); togglePinSession(s.session_id); };

        const renameBtn = document.createElement("button");
        renameBtn.className = "icon-btn";
        renameBtn.style.fontSize = "0.75rem";
        renameBtn.textContent = "✎";
        renameBtn.onclick = (e) => { e.stopPropagation(); renameSession(s.session_id, s.title); };

        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn";
        delBtn.style.fontSize = "0.75rem";
        delBtn.textContent = "✕";
        delBtn.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };

        actions.appendChild(pinBtn);
        actions.appendChild(renameBtn);
        actions.appendChild(delBtn);
        li.appendChild(titleSpan);
        li.appendChild(actions);
        list.appendChild(li);
      }
    }

    function updateHeroVisibility() {
      const container = document.getElementById("chat-messages");
      document.getElementById("welcome-hero").style.display = container.children.length === 0 ? "flex" : "none";
    }

    async function selectSession(sessionId) {
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId, {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
          renderSessionList();
          return;
        }
        activeSessionId = sessionId;
        setCookie("nourai_active_session", sessionId, 7);
        renderSessionList();
        const data = await res.json();
        const container = document.getElementById("chat-messages");
        container.innerHTML = "";
        for (const msg of (data.session.messages || [])) {
          const obj = appendMessageBubble(msg.role, "");
          renderFormattedContent(obj.textNode, msg.content);
        }
        updateHeroVisibility();
      } catch (err) {
        showError(err.message);
      }
    }

    async function renameSession(sessionId, oldTitle) {
      const newTitle = prompt(I18N[currentLanguage].renamePrompt, oldTitle || "");
      if (!newTitle || !newTitle.trim()) return;
      const token = await ensureAuthenticated();
      if (!token) return;
      const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId + "/rename", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ title: newTitle.trim() })
      });
      if (res.ok) await refreshSessionList();
    }

    async function deleteSession(sessionId) {
      const token = await ensureAuthenticated();
      if (!token) return;
      const res = await fetch(API_BASE + "/api/v1/sessions/" + sessionId, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      if (res.ok) {
        if (activeSessionId === sessionId) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
          document.getElementById("chat-messages").innerHTML = "";
          updateHeroVisibility();
        }
        await refreshSessionList();
      }
    }

    async function stopGeneration() {
      stopStreamingFlag = true;
      const token = await ensureAuthenticated();
      if (!token) return;
      await fetch(API_BASE + "/api/v1/chat/stop", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token }
      });
    }

    function switchLanguage(lang) {
      const cfg = I18N[lang] || I18N.arabic;
      currentLanguage = lang;
      setCookie("nourai_lang", lang, 90);
      const root = document.getElementById("html-root");
      root.setAttribute("dir", cfg.dir);
      root.setAttribute("lang", cfg.lang);
      document.getElementById("hero-title").textContent = cfg.heroTitle;
      document.getElementById("ui-history-title").textContent = cfg.history;
      document.getElementById("new-session-label").textContent = cfg.newSession;
      document.getElementById("prompt-input").setAttribute("placeholder", cfg.placeholder);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderQuizBlock(jsonStr) {
      try {
        const q = JSON.parse(jsonStr);
        const qId = "quiz-" + Math.floor(Math.random() * 100000);
        const optsHtml = (q.options || []).map((opt, idx) => {
          const isCorrect = idx === q.correct ? "1" : "0";
          const expEnc = encodeURIComponent(q.explanation || "");
          return `<button class="chip" style="display:block;width:100%;text-align:start;margin-top:0.4rem;border-radius:0.5rem;" onclick="checkQuizAnswer(this, ${isCorrect}, '${qId}', decodeURIComponent('${expEnc}'))">${escapeHtml(opt)}</button>`;
        }).join("");
        return `<div style="background:var(--bg-sidebar);border:1px solid var(--border);border-radius:0.75rem;padding:0.9rem;margin:0.5rem 0;"><strong>${escapeHtml(q.question || "")}</strong><div style="margin-top:0.4rem;">${optsHtml}</div><div id="${qId}" style="margin-top:0.55rem;font-size:0.84rem;display:none;"></div></div>`;
      } catch (e) {
        return escapeHtml(jsonStr);
      }
    }

    function checkQuizAnswer(btnEl, isCorrect, feedbackId, explanation) {
      const fb = document.getElementById(feedbackId);
      if (!fb) return;
      fb.style.display = "block";
      if (isCorrect) {
        btnEl.style.borderColor = "#22c55e";
        btnEl.style.background = "#143321";
        fb.style.color = "#86efac";
        fb.textContent = "✅ " + explanation;
      } else {
        btnEl.style.borderColor = "#ef4444";
        btnEl.style.background = "#3b1c1c";
        fb.style.color = "#fca5a5";
        fb.textContent = "❌ إجابة غير صحيحة، حاول اختيار خيار آخر.";
      }
    }

    function formatInlineMarkdown(text) {
      if (text.includes("[QUIZ_JSON]") && text.includes("[/QUIZ_JSON]")) {
        const parts = text.split(/\[QUIZ_JSON\]([\s\S]*?)\[\/QUIZ_JSON\]/g);
        let out = "";
        for (let i = 0; i < parts.length; i++) {
          if (i % 2 === 0) out += formatInlineMarkdown(parts[i]);
          else out += renderQuizBlock(parts[i]);
        }
        return out;
      }
      let s = escapeHtml(text);
      s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" class="generated-img" loading="lazy" />');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:#93c5fd;text-decoration:underline;">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return s.replace(/\n/g, "<br/>");
    }

    function renderFormattedContent(targetEl, rawText) {
      targetEl.dataset.raw = rawText;
      if (!rawText.includes("```")) {
        targetEl.innerHTML = formatInlineMarkdown(rawText);
        return;
      }
      const parts = rawText.split(/```(\w*)\n?([\s\S]*?)```/g);
      let html = "";
      for (let i = 0; i < parts.length; i += 3) {
        const normalText = parts[i] || "";
        html += formatInlineMarkdown(normalText);
        if (i + 2 < parts.length) {
          const lang = (parts[i + 1] || "code").toLowerCase();
          const code = parts[i + 2] || "";
          const encodedCode = encodeURIComponent(code);
          const outId = "py-out-" + i + "-" + Math.floor(Math.random() * 100000);
          const isPreviewable = lang === "html" || lang === "svg" || code.includes("<html") || code.includes("<style");
          const isPython = lang === "python" || lang === "py" || code.includes("def ") || code.includes("print(");
          const previewBtn = isPreviewable
            ? `<button class="icon-btn" style="font-size:0.75rem;" onclick="openLiveCanvas(decodeURIComponent('${encodedCode}'))">▶️ معاينة</button>`
            : (isPython ? `<button class="icon-btn" style="font-size:0.75rem;" onclick="runPythonCode(decodeURIComponent('${encodedCode}'), '${outId}')">▶️ تشغيل</button>` : "");
          const inlineSvg = lang === "svg" && code.trim().startsWith("<svg") ? `<div style="margin:0.5rem 0;">${code}</div>` : "";
          html += `${inlineSvg}<pre><div class="code-header"><span>${escapeHtml(lang)}</span><div>${previewBtn}<button class="icon-btn" style="font-size:0.75rem;" onclick="copyAnswer(decodeURIComponent('${encodedCode}'), this)">نسخ</button></div></div><code>${escapeHtml(code)}</code><div id="${outId}" style="display:none;padding:0.5rem 0.8rem;border-top:1px solid var(--border);background:#0d0d0d;color:#86efac;font-family:monospace;font-size:0.8rem;white-space:pre-wrap;"></div></pre>`;
        }
      }
      targetEl.innerHTML = html;
    }

    async function runPythonCode(codeStr, outputId) {
      const outEl = document.getElementById(outputId);
      if (!outEl) return;
      outEl.style.display = "block";
      outEl.textContent = "جاري التشغيل...";
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const res = await fetch(API_BASE + "/api/v1/code/run", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ code: codeStr })
        });
        const data = await res.json();
        if (!res.ok) {
          outEl.style.color = "#fca5a5";
          outEl.textContent = data.error || "خطأ في التشغيل";
        } else {
          outEl.style.color = data.exit_code === 0 ? "#86efac" : "#fca5a5";
          outEl.textContent = (data.stdout || data.stderr || "(تم التنفيذ بنجاح بدون مخرجات نصية)").trim();
        }
      } catch (err) {
        outEl.style.color = "#fca5a5";
        outEl.textContent = err.message;
      }
    }

    async function sendStreamingMessage() {
      hideError();
      const input = document.getElementById("prompt-input");
      const text = input.value.trim();
      if (!text) return;
      const token = await ensureAuthenticated();
      if (!token) return;

      input.value = "";
      input.style.height = "auto";
      stopStreamingFlag = false;

      appendMessageBubble("user", text);
      updateHeroVisibility();

      const selectedMode = document.getElementById("engine-mode-select").value;
      const enableWebSearch = selectedMode === "web_ai";
      const useFallback = selectedMode === "fallback" || selectedMode === "web_ai";
      const geminiKey = (document.getElementById("gemini-key-input").value || "").trim();
      const assistantObj = appendMessageBubble("assistant", "");

      document.getElementById("send-btn").style.display = "none";
      document.getElementById("stop-btn").style.display = "flex";

      try {
        let reqBody = {
          session_id: activeSessionId,
          language: currentLanguage,
          message: text,
          enable_web_search: enableWebSearch,
          use_fallback_assistant: useFallback,
          gemini_api_key: geminiKey,
          persona: document.getElementById("persona-select").value,
          strategy: document.getElementById("strategy-select").value,
          temperature: parseFloat(document.getElementById("temperature-input").value),
          top_k: parseInt(document.getElementById("top-k-input").value, 10),
          top_p: parseFloat(document.getElementById("top-p-input").value),
          max_new_tokens: parseInt(document.getElementById("max-tokens-input").value, 10)
        };
        let response = await fetch(API_BASE + "/api/v1/chat/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(reqBody)
        });
        if (response.status === 404 && activeSessionId) {
          activeSessionId = null;
          setCookie("nourai_active_session", "", -1);
          reqBody.session_id = null;
          response = await fetch(API_BASE + "/api/v1/chat/stream", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify(reqBody)
          });
        }
        const payload = await response.json();
        if (!response.ok) {
          showError(payload.error || "Request failed");
          document.getElementById("send-btn").style.display = "flex";
          document.getElementById("stop-btn").style.display = "none";
          return;
        }
        activeSessionId = payload.session_id || activeSessionId;
        setCookie("nourai_active_session", activeSessionId, 7);

        let fullStreamed = "";
        if (payload.stream_chunks) {
          for (const chunk of payload.stream_chunks) {
            if (stopStreamingFlag) break;
            fullStreamed += chunk.text_delta;
            renderFormattedContent(assistantObj.textNode, fullStreamed);
            const container = document.getElementById("chat-messages");
            container.scrollTop = container.scrollHeight;
            await new Promise(r => setTimeout(r, 12));
          }
        }
        await refreshSessionList();
        await refreshMemoriesAndDocs();
      } catch (err) {
        showError(err.message);
      }
      document.getElementById("send-btn").style.display = "flex";
      document.getElementById("stop-btn").style.display = "none";
    }

    function copyAnswer(text, btnEl) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      }
      const prev = btnEl.textContent;
      btnEl.textContent = I18N[currentLanguage].copied;
      setTimeout(() => { btnEl.textContent = prev; }, 1200);
    }

    function appendMessageBubble(role, text) {
      const container = document.getElementById("chat-messages");
      const row = document.createElement("div");
      row.className = "message-row row-" + role;

      const div = document.createElement("div");
      div.className = "message-bubble message-" + role;
      div.setAttribute("dir", "auto");

      const textSpan = document.createElement("div");
      textSpan.className = "msg-content";
      renderFormattedContent(textSpan, text);
      div.appendChild(textSpan);

      if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "bubble-actions";
        const copyBtn = document.createElement("button");
        copyBtn.className = "icon-btn";
        copyBtn.style.fontSize = "0.75rem";
        copyBtn.textContent = I18N[currentLanguage].copy;
        copyBtn.onclick = () => copyAnswer(textSpan.dataset.raw || textSpan.textContent, copyBtn);
        actions.appendChild(copyBtn);
        div.appendChild(actions);
      }

      row.appendChild(div);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return { bubble: div, textNode: textSpan };
    }

    function createNewSession() {
      activeSessionId = null;
      setCookie("nourai_active_session", "", -1);
      document.getElementById("chat-messages").innerHTML = "";
      updateHeroVisibility();
      renderSessionList();
    }

    function openLiveCanvas(codeStr) {
      document.getElementById("live-canvas-iframe").srcdoc = codeStr;
      document.getElementById("live-canvas-modal").style.display = "flex";
    }

    function closeLiveCanvas() {
      document.getElementById("live-canvas-iframe").srcdoc = "";
      document.getElementById("live-canvas-modal").style.display = "none";
    }

    async function refreshMemoriesAndDocs() {
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const mRes = await fetch(API_BASE + "/api/v1/memories", { headers: { "Authorization": "Bearer " + token } });
        if (mRes.ok) {
          const mData = await mRes.json();
          const mems = mData.memories || [];
          document.getElementById("memories-list").textContent = mems.length ? mems.map(m => m.fact).join(" · ") : "—";
        }
      } catch (e) {}
    }

    async function handleFileUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const token = await ensureAuthenticated();
      if (!token) return;
      try {
        const lowerName = file.name.toLowerCase();
        let payloadBody = { filename: file.name };
        if (lowerName.endsWith(".docx") || lowerName.endsWith(".pdf")) {
          const buf = await file.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let binary = "";
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          payloadBody.content_base64 = btoa(binary);
        } else {
          payloadBody.content = await file.text();
        }
        const res = await fetch(API_BASE + "/api/v1/documents", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify(payloadBody)
        });
        if (res.ok) {
          document.getElementById("prompt-input").value = `لخص ما ورد في الملف المرفق (${file.name})`;
        } else {
          const err = await res.json();
          showError(err.error || "فشل قراءة الملف");
        }
      } catch (err) {
        showError(err.message);
      }
      inputEl.value = "";
    }

    window.addEventListener("DOMContentLoaded", async () => {
      if (!getCookie("nourai_cookies_accepted")) {
        document.getElementById("cookie-banner").style.display = "flex";
      }
      const savedLang = getCookie("nourai_lang");
      if (savedLang && I18N[savedLang]) {
        document.getElementById("language-selector").value = savedLang;
        switchLanguage(savedLang);
      }
      const savedMode = getCookie("nourai_mode");
      if (savedMode) {
        document.getElementById("engine-mode-select").value = savedMode;
      }
      const savedKey = getCookie("nourai_gemini_key");
      if (savedKey) {
        document.getElementById("gemini-key-input").value = savedKey;
      }
      const savedPersona = getCookie("nourai_persona");
      if (savedPersona) {
        document.getElementById("persona-select").value = savedPersona;
      }
      await refreshSessionList();
      const savedSess = getCookie("nourai_active_session");
      if (savedSess) {
        await selectSession(savedSess);
      }
      await refreshMemoriesAndDocs();
      updateHeroVisibility();
    });
  </script>
</body>
</html>
